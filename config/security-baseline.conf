# ==========================================
# Linux Security Audit Toolkit
# Security Baseline Configuration
# ==========================================

# SSH Security
REQUIRE_SSH_ROOT_LOGIN_DISABLED=true
REQUIRE_SSH_PASSWORD_AUTH_DISABLED=true
REQUIRE_SSH_PUBLICKEY_AUTH=true

# Firewall
REQUIRE_FIREWALL=true

# SELinux
REQUIRE_SELINUX=enforcing

# Auditing
REQUIRE_AUDITD=true

# Privileged Accounts
ALLOW_MULTIPLE_UID0=false

# SUID
MAX_SUID_COUNT=50

# Reporting
REPORT_DIRECTORY="reports"

# ==========================================
# End of Configuration
# ==========================================
